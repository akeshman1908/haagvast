name: Build and deploy HaagVast to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: haagvast-production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: haagvast-prod-736418
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_c89d96bab8454de3bb3da421c646c724 }}
          package: .